<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind Flexbox Layout</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Container -->
  <div class="flex flex-col md:flex-row min-h-screen">

    <!-- Sidebar -->
    <aside class="bg-blue-600 text-white w-full md:w-64 p-6">
      <h1 class="text-2xl font-bold mb-4">Sidebar</h1>
      <nav class="space-y-2">
        <a href="#" class="block hover:bg-blue-700 p-2 rounded">Home</a>
        <a href="#" class="block hover:bg-blue-700 p-2 rounded">About</a>
        <a href="#" class="block hover:bg-blue-700 p-2 rounded">Services</a>
        <a href="#" class="block hover:bg-blue-700 p-2 rounded">Contact</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">

      <!-- Header -->
      <header class="bg-white shadow rounded-lg p-4 mb-6">
        <h2 class="text-3xl font-semibold">Flexbox Layout</h2>
      </header>

      <!-- Cards Section -->
      <section class="flex flex-col sm:flex-row gap-4">

        <div class="flex-1 bg-white p-6 rounded-lg shadow">
          <h3 class="text-xl font-bold mb-2">Card 1</h3>
          <p>Lorem ipsum dolor sit amet.</p>
        </div>

        <div class="flex-1 bg-white p-6 rounded-lg shadow">
          <h3 class="text-xl font-bold mb-2">Card 2</h3>
          <p>Consectetur adipiscing elit.</p>
        </div>

        <div class="flex-1 bg-white p-6 rounded-lg shadow">
          <h3 class="text-xl font-bold mb-2">Card 3</h3>
          <p>Sed do eiusmod tempor incididunt.</p>
        </div>

      </section>

    </main>

  </div>

</body>
</html>
