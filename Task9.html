<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Navbar</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-blue-600 text-white">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex justify-between items-center h-16">

        <!-- Logo -->
        <div class="text-2xl font-bold">
          MyLogo
        </div>

        <!-- Desktop Menu -->
        <div class="hidden md:flex space-x-6">
          <a href="#" class="hover:text-gray-200">Home</a>
          <a href="#" class="hover:text-gray-200">About</a>
          <a href="#" class="hover:text-gray-200">Services</a>
          <a href="#" class="hover:text-gray-200">Contact</a>
        </div>

        <!-- Mobile Button -->
        <button
          id="menu-btn"
          class="md:hidden focus:outline-none"
        >
          <!-- Hamburger Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>

      </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden px-4 pb-4">
      <a href="#" class="block py-2 hover:text-gray-200">Home</a>
      <a href="#" class="block py-2 hover:text-gray-200">About</a>
      <a href="#" class="block py-2 hover:text-gray-200">Services</a>
      <a href="#" class="block py-2 hover:text-gray-200">Contact</a>
    </div>
  </nav>

  <!-- JavaScript -->
  <script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  </script>

</body>
</html>
