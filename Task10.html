<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-3xl font-bold text-center mb-6">
      Registration Form
    </h2>

    <form id="registerForm" class="space-y-4">

      <!-- Name -->
      <div>
        <label class="block mb-1 font-medium">Full Name</label>
        <input
          type="text"
          id="name"
          class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your name"
        />
        <p id="nameError" class="text-red-500 text-sm mt-1"></p>
      </div>

      <!-- Email -->
      <div>
        <label class="block mb-1 font-medium">Email</label>
        <input
          type="email"
          id="email"
          class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your email"
        />
        <p id="emailError" class="text-red-500 text-sm mt-1"></p>
      </div>

      <!-- Password -->
      <div>
        <label class="block mb-1 font-medium">Password</label>
        <input
          type="password"
          id="password"
          class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter password"
        />
        <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block mb-1 font-medium">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Confirm password"
        />
        <p id="confirmPasswordError" class="text-red-500 text-sm mt-1"></p>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition"
      >
        Register
      </button>

    </form>

    <!-- Success Message -->
    <p id="successMessage" class="text-green-600 text-center mt-4 font-medium"></p>
  </div>

  <script>
    const form = document.getElementById("registerForm");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      // Input values
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      // Error elements
      const nameError = document.getElementById("nameError");
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");
      const confirmPasswordError = document.getElementById("confirmPasswordError");
      const successMessage = document.getElementById("successMessage");

      // Clear previous messages
      nameError.textContent = "";
      emailError.textContent = "";
      passwordError.textContent = "";
      confirmPasswordError.textContent = "";
      successMessage.textContent = "";

      let isValid = true;

      // Name Validation
      if (name === "") {
        nameError.textContent = "Name is required";
        isValid = false;
      }

      // Email Validation
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

      if (email === "") {
        emailError.textContent = "Email is required";
        isValid = false;
      } else if (!email.match(emailPattern)) {
        emailError.textContent = "Enter a valid email";
        isValid = false;
      }

      // Password Validation
      if (password === "") {
        passwordError.textContent = "Password is required";
        isValid = false;
      } else if (password.length < 6) {
        passwordError.textContent =
          "Password must be at least 6 characters";
        isValid = false;
      }

      // Confirm Password Validation
      if (confirmPassword === "") {
        confirmPasswordError.textContent =
          "Please confirm your password";
        isValid = false;
      } else if (password !== confirmPassword) {
        confirmPasswordError.textContent =
          "Passwords do not match";
        isValid = false;
      }

      // Success
      if (isValid) {
        successMessage.textContent =
          "Registration successful!";
        form.reset();
      }
    });
  </script>

</body>
</html>
